name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify secret is set
        run: |
          if [ -z "${{ secrets.YOUR_GROQ_API_KEY_HERE }}" ]; then
            echo "::error::Secret YOUR_GROQ_API_KEY_HERE is EMPTY or missing. Deploy stopped."
            exit 1
          fi
          echo "Secret is present (length check passed)."

      - name: Inject API Key
        run: |
          sed -i "s/YOUR_GROQ_API_KEY_HERE/${{ secrets.YOUR_GROQ_API_KEY_HERE }}/g" script.js
          if grep -q "YOUR_GROQ_API_KEY_HERE" script.js; then
            echo "::error::sed replacement failed, placeholder still present in script.js"
            exit 1
          fi
          echo "API key injected successfully."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
