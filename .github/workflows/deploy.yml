name: Deploy to GitHub Pages with Secret

on:
  push:
    branches: ["main"] # เปลี่ยนเป็นชื่อ Branch หลักของคุณถ้าไม่ได้ใช้ main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      # ขั้นตอนสำคัญ: ค้นหาคำว่า {{YOUR_GROQ_API_KEY_HERE}} ใน script.js แล้วแทนที่ด้วย Secret
      - name: Inject API Key
        run: sed -i 's/{{YOUR_GROQ_API_KEY_HERE}}/${{ secrets.YOUR_GROQ_API_KEY_HERE }}/g' script.js
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
